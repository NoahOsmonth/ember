<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Ember visual fixture</title>
<link rel="stylesheet" href="../../src/renderer/widget/widget.css">
<style>
  /* A fixed desktop backdrop makes transparent-window screenshots comparable. */
  html, body { background: #1b1f27 !important; }
</style>
</head>
<body class="ready">
  <div id="app">
    <div class="time">
      <div class="digits" id="digits" role="timer" aria-label="Time remaining">25<span class="c">:</span>00</div>
      <div class="meta"><span class="state" id="state">ready</span><span class="pips" id="pips"></span></div>
    </div>
    <div class="strip">
      <div class="bars" id="bars"></div>
      <div class="foot">
        <span class="note" id="note"></span>
        <div class="ctl">
          <button class="play" aria-label="Start or pause">
            <svg class="play-i" viewBox="0 0 12 12"><path d="M3 1.8v8.4L10 6z"/></svg>
            <svg class="pause-i" viewBox="0 0 12 12"><rect x="2.5" y="2" width="2.6" height="8" rx=".8"/><rect x="6.9" y="2" width="2.6" height="8" rx=".8"/></svg>
          </button>
          <button aria-label="Skip"><svg viewBox="0 0 12 12"><path d="M2.5 2.5 7 6l-4.5 3.5z"/><path d="M9.5 2.5v7"/></svg></button>
          <button aria-label="Reset"><svg viewBox="0 0 12 12"><path d="M2.2 6a3.8 3.8 0 1 0 1.2-2.8"/><path d="M2.2 1.6v2.2h2.2"/></svg></button>
          <button aria-label="Settings"><svg viewBox="0 0 12 12"><path d="M1.5 3.5h9M1.5 8.5h9"/><circle cx="4" cy="3.5" r="1.3" fill="var(--bg, #0b0c10)"/><circle cx="8" cy="8.5" r="1.3" fill="var(--bg, #0b0c10)"/></svg></button>
        </div>
      </div>
    </div>
    <div class="fuse"><i id="fuse"></i></div>
  </div>

<script type="module">
import { computeRuler } from '../../src/core/ruler.js';
import { barColor } from '../../src/core/themes.js';

const query = new URLSearchParams(location.search);
const state = ['idle', 'running', 'paused'].includes(query.get('state')) ? query.get('state') : 'idle';
const theme = query.get('theme') === 'mono' ? 'mono' : 'dusk';
const totalMs = 25 * 60_000;
const elapsedMs = state === 'idle' ? 0 : 10 * 60_000;
const remainingMs = totalMs - elapsedMs;

const bodyClass = state === 'idle' ? 'ready' : state;
document.body.className = bodyClass;
document.title = 'Ember visual fixture';

const digits = document.getElementById('digits');
const minutes = Math.floor(remainingMs / 60_000);
const seconds = Math.floor((remainingMs % 60_000) / 1000);
digits.innerHTML = String(minutes).padStart(2, '0') + '<span class="c">:</span>' + String(seconds).padStart(2, '0');
document.getElementById('state').textContent =
  state === 'idle' ? 'ready' : state === 'running' ? 'focus' : 'paused';
document.getElementById('note').textContent = state === 'running' ? 'ends 10:25' : '';

const pips = document.getElementById('pips');
const done = state === 'idle' ? 0 : 1;
pips.innerHTML = Array.from({ length: 4 }, (_, index) => {
  const cls = index < done ? 'pip done' : index === done && state !== 'idle' ? 'pip now' : 'pip';
  return `<i class="${cls}"></i>`;
}).join('');

const ruler = computeRuler({ durationMs: totalMs, elapsedMs });
const bars = document.getElementById('bars');
bars.style.setProperty('--gap', ruler.count > 20 ? '3px' : '5px');
let accent = '#fff';
for (let index = 0; index < ruler.count; index += 1) {
  const bar = document.createElement('i');
  bar.className = 'bar' + ((index + 1) % 5 === 0 || index === ruler.count - 1 ? ' tick' : '');
  const color = barColor(theme, 'focus', index, ruler.count);
  bar.style.setProperty('--c', color);
  const fill = ruler.bars[index].fill;
  const drain = fill >= 1 ? 0 : fill === 0 ? 1 : 1 - fill;
  bar.style.setProperty('--f', drain.toFixed(3));
  if (fill < 1) accent = color;
  bars.appendChild(bar);
}
document.documentElement.style.setProperty('--accent', accent);
document.documentElement.style.setProperty('--a', '0.62');
document.getElementById('fuse').parentElement.style.setProperty(
  '--p',
  (remainingMs / totalMs).toFixed(4)
);

document.body.dataset.ready = 'true';
</script>
</body>
</html>
