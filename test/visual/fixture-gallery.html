<!doctype html>
<html lang="en">
<head>

<meta name="color-scheme" content="dark">
<title>Ember visual fixture</title>
<link rel="stylesheet" href="../../src/renderer/widget/widget.css">
<style>
  /* A fixed desktop backdrop makes transparent-window screenshots comparable. */

  body { height: auto; overflow: visible; }
  #gallery { display: grid; gap: 16px; }
  #gallery.grid { padding: 16px; }
  .fixture { position: relative; width: 340px; height: 96px; }
</style>
</head>

  <div id="gallery"></div>
  <script type="module" src="./fixture-gallery.js"></script>
