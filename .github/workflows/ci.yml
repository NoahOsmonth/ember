name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Keep test channels in one place
        shell: bash
        run: |
          if git grep -nE "(ipcMain|ipcRenderer)\.(handle|on)\(['\"]test:" -- src ':!src/main/test-support.js'; then
            echo "test: channels may only be registered in src/main/test-support.js" >&2
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:cov

      - name: Install the Playwright browser
        run: npx playwright install chromium

      - name: Launch tests
        run: npm run test:e2e

      - name: Visual regression tests
        run: npm run test:visual

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Build the portable executable
        run: npm run dist

      - name: Upload the portable executable
        uses: actions/upload-artifact@v4
        with:
          name: ember-portable
          path: dist/*.exe
          if-no-files-found: error
