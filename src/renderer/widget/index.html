<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Ember</title>
<link rel="stylesheet" href="widget.css">
</head>
<body class="ready">
  <div id="app">
    <div class="time">
      <div class="digits" id="digits" role="timer" aria-label="Time remaining">25<span class="c">:</span>00</div>
      <div class="meta"><span class="state" id="state">ready</span><span class="pips" id="pips"></span></div>
    </div>
    <div class="strip">
      <div class="bars" id="bars"></div>
      <div class="foot">
        <span class="note" id="note"></span>
        <div class="ctl">
          <button class="play" id="bPlay" title="Start / pause (Space)" aria-label="Start or pause">
            <svg class="play-i" viewBox="0 0 12 12"><path d="M3 1.8v8.4L10 6z"/></svg>
            <svg class="pause-i" viewBox="0 0 12 12"><rect x="2.5" y="2" width="2.6" height="8" rx=".8"/><rect x="6.9" y="2" width="2.6" height="8" rx=".8"/></svg>
          </button>
          <button id="bSkip" title="Skip to next (S)" aria-label="Skip"><svg viewBox="0 0 12 12"><path d="M2.5 2.5 7 6l-4.5 3.5z"/><path d="M9.5 2.5v7"/></svg></button>
          <button id="bReset" title="Reset (R)" aria-label="Reset"><svg viewBox="0 0 12 12"><path d="M2.2 6a3.8 3.8 0 1 0 1.2-2.8"/><path d="M2.2 1.6v2.2h2.2"/></svg></button>
          <button id="bSettings" title="Settings" aria-label="Settings"><svg viewBox="0 0 12 12"><path d="M1.5 3.5h9M1.5 8.5h9"/><circle cx="4" cy="3.5" r="1.3" fill="var(--bg, #0b0c10)"/><circle cx="8" cy="8.5" r="1.3" fill="var(--bg, #0b0c10)"/></svg></button>
        </div>
      </div>
    </div>
    <div class="fuse"><i id="fuse"></i></div>
  </div>

<script type="module">
import { DEFAULTS, chime } from '../shared/common.js';
import { computeRuler } from '../../core/ruler.js';
import { barColor } from '../../core/themes.js';

(() => {
  // Falls back to a stub so index.html also previews in a plain browser. The
  // stub returns the same `{ ok, value }` envelopes as the real preload API.
  const api = window.ember || {
    state: {
      get: async () => ({ ok: true, value: { ...DEFAULTS } }),
      set: async () => ({ ok: true, value: undefined }),
      reset: async () => ({ ok: true, value: { ...DEFAULTS } }),
    },
    win: {
      move() {},
      mini: async () => ({ ok: true, value: undefined }),
      lock: async () => ({ ok: true, value: undefined }),
      close() {},
    },
    app: { quit() {} },
    menu: { show() {} },
    settings: { open: async () => ({ ok: true, value: undefined }) },
    timer: {
      get: async () => ({ ok: true, value: undefined }),
      start: async () => ({ ok: true, value: undefined }),
      pause: async () => ({ ok: true, value: undefined }),
      toggle: async () => ({ ok: true, value: undefined }),
      skip: async () => ({ ok: true, value: undefined }),
      reset: async () => ({ ok: true, value: undefined }),
      subscribe: async () => ({ ok: true, value: { snapshot: undefined, notice: null } }),
      onSnapshot() {
        return () => {};
      },
      onPhaseComplete() {
        return () => {};
      },
    },
    onSettings() {},
    onCommand() {},
    onTab() {},
  };

  // Unwrap the registry envelope once. A failed call is logged and leaves the
  // renderer running; it never becomes an unhandled rejection.
  async function call(method, ...args) {
    const result = await method(...args);
    if (!result || result.ok !== true) {
      console.error('ember ipc failed', result);
      return undefined;
    }
    return result.value;
  }

  const LABEL = { focus: 'focus', short: 'short break', long: 'long break' };
  const $ = id => document.getElementById(id);
  const el = { digits: $('digits'), state: $('state'), pips: $('pips'), bars: $('bars'), note: $('note'), fuse: $('fuse') };

  let cfg = { ...DEFAULTS, locked: false };
  let snap = {
    phase: 'focus',
    status: 'idle',
    remainingMs: DEFAULTS.durations.focus * 60000,
    durationMs: DEFAULTS.durations.focus * 60000,
    endsAtWall: null,
    rounds: 0,
    settingsRevision: 0,
  };
  let pending = null;
  let bars = [], lastIdx = -2, lastText = '', lastBuild = '', flashUntil = 0, flashMsg = '';
  let announcedRecovery = false;

  const total = () => snap.durationMs || cfg.durations[snap.phase] * 60000;
  const remaining = () => Math.max(0, Math.min(snap.remainingMs, total()));

  function mode() {
    if (pending === 'paused') return 'paused';
    if (pending === 'running') return 'running';
    if (snap.status === 'running') return 'running';
    if (snap.status === 'paused') return 'paused';
    return 'ready';
  }

  // Geometry comes from the core ruler: the unit grows so a long phase still
  // shows at most 30 bars, and the palette decides each bar's color.
  function build() {
    const ruler = computeRuler({ durationMs: total() });
    const n = ruler.count;
    el.bars.style.setProperty('--gap', n > 20 ? '3px' : '5px');
    el.bars.innerHTML = '';
    bars = [];
    for (let i = 0; i < n; i++) {
      const b = document.createElement('i');
      b.className = 'bar' + ((i + 1) % 5 === 0 || i === n - 1 ? ' tick' : '');
      b.style.setProperty('--c', barColor(cfg.theme, snap.phase, i, n));
      el.bars.appendChild(b);
      bars.push(b);
    }
    lastIdx = -2;
  }

  function notify(was) {
    if (!cfg.notify) return;
    try {
      new Notification(was === 'focus' ? 'Focus round done' : 'Break over', {
        body: was === 'focus' ? 'Time for a break.' : 'Ready for the next focus round.',
        silent: true,
      });
    } catch {}
  }

  function flash(msg, ms = 1400) {
    flashUntil = Date.now() + ms;
    flashMsg = msg;
    render();
    setTimeout(() => render(), ms + 10);
  }

  function render() {
    const rem = remaining();
    const m = mode();
    document.body.className = (cfg.mini ? 'mini ' : '') + m + (cfg.locked ? ' locked' : '');

    const buildKey = snap.phase + '|' + total() + '|' + cfg.theme;
    if (buildKey !== lastBuild) {
      build();
      lastBuild = buildKey;
    }

    const secs = Math.ceil(rem / 1000);
    const text = String(Math.floor(secs / 60)).padStart(2, '0') + ':' + String(secs % 60).padStart(2, '0');
    if (text !== lastText) {
      el.digits.innerHTML = text.replace(':', '<span class="c">:</span>');
      lastText = text;
      document.title = `${text} ${LABEL[snap.phase]}`;
    }

    // --f is the remaining fraction of a bar: the ruler drains left to right.
    const ruler = computeRuler({ durationMs: total(), elapsedMs: total() - rem });
    const idx = Math.min(bars.length - 1, ruler.bars.filter(b => b.fill >= 1).length);
    if (idx !== lastIdx) {
      bars.forEach((b, i) => b.style.setProperty('--f', i < idx ? 0 : 1));
      lastIdx = idx;
      document.documentElement.style.setProperty('--accent', bars[idx]?.style.getPropertyValue('--c') || '#fff');
    }
    if (bars[idx]) {
      const fill = Math.max(0, Math.min(1, 1 - (ruler.bars[idx]?.fill ?? 0)));
      bars[idx].style.setProperty('--f', fill.toFixed(3));
    }
    el.fuse.parentElement.style.setProperty('--p', (rem / total()).toFixed(4));

    el.state.textContent = Date.now() < flashUntil
      ? flashMsg
      : m === 'ready' ? (snap.phase === 'focus' ? 'ready' : LABEL[snap.phase]) : m === 'paused' ? 'paused' : LABEL[snap.phase];

    if (el.pips.children.length !== cfg.rounds) el.pips.innerHTML = '<i class="pip"></i>'.repeat(cfg.rounds);
    const done = Math.min(snap.rounds, cfg.rounds);
    [...el.pips.children].forEach((p, i) => {
      p.className = 'pip' + (i < done ? ' done' : i === done && snap.phase === 'focus' ? ' now' : '');
    });

    el.note.textContent = snap.status === 'running' && snap.endsAtWall
      ? 'ends ' + new Date(snap.endsAtWall).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
      : '';
  }

  /* interaction */
  async function command(method, label) {
    if (label) {
      pending = label;
      render();
    }
    const result = await method();
    if (!result || result.ok !== true) {
      pending = null;
      flash('command failed', 2000);
      return;
    }
    if (result.value && result.value.phase) {
      snap = result.value;
      pending = null;
      render();
    }
  }

  function toggle() {
    command(api.timer.toggle, mode() === 'running' ? 'paused' : 'running');
  }

  el.digits.addEventListener('click', toggle);
  $('bPlay').addEventListener('click', toggle);
  $('bSkip').addEventListener('click', () => command(api.timer.skip));
  $('bReset').addEventListener('click', () => command(api.timer.reset));
  $('bSettings').addEventListener('click', () => call(api.settings.open, 'settings'));

  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'r' || e.key === 'R') command(api.timer.reset);
    else if (e.key === 's' || e.key === 'S') command(api.timer.skip);
    else if (e.key === 'm' || e.key === 'M') call(api.win.mini, !cfg.mini);
  });

  // drag from anywhere that isn't a control (own drag, so right-click and wheel keep working).
  // The window moves by pointer deltas: `win:move` is a send channel, so a drag
  // never waits on a round trip.
  let drag = null;
  addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('button') || e.target.closest('.digits')) return;
    drag = { sx: e.screenX, sy: e.screenY };
    document.body.setPointerCapture?.(e.pointerId);
  });
  addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.screenX - drag.sx;
    const dy = e.screenY - drag.sy;
    if (dx || dy) {
      api.win.move({ dx, dy });
      drag.sx = e.screenX;
      drag.sy = e.screenY;
    }
  });
  addEventListener('pointerup', () => { drag = null; });
  addEventListener('dblclick', e => { if (!e.target.closest('button, .digits')) call(api.win.mini, !cfg.mini); });
  addEventListener('contextmenu', e => { e.preventDefault(); api.menu.show(); });

  // wheel over the widget: glass opacity
  let opTimer;
  addEventListener('wheel', e => {
    e.preventDefault();
    cfg.opacity = Math.max(.12, Math.min(.96, +(cfg.opacity + (e.deltaY < 0 ? .05 : -.05)).toFixed(2)));
    document.documentElement.style.setProperty('--a', cfg.opacity);
    flash('glass ' + Math.round(cfg.opacity * 100) + '%');
    clearTimeout(opTimer); opTimer = setTimeout(() => call(api.state.set, { opacity: cfg.opacity }), 300);
  }, { passive: false });

  function applySettings(s) {
    const prev = cfg;
    cfg = { ...cfg, ...s };
    document.documentElement.style.setProperty('--a', cfg.opacity);
    render();
    if (cfg.locked && !prev.locked) flash('click-through', 4000);
    // One quiet line when the settings file had to be repaired or replaced.
    if (cfg.settingsRecovered && !announcedRecovery) { announcedRecovery = true; flash('settings reset', 4000); }
  }

  // preview only: index.html?demo=phase,elapsed(0-1),run|pause,mini|full,doneRounds[,theme]
  function demo() {
    const q = new URLSearchParams(location.search).get('demo');
    if (!q || window.ember) return false;
    const [ph, e, st, size, done, theme] = q.split(',');
    cfg.mini = size === 'mini';
    if (theme) cfg.theme = theme;
    const durationMs = (cfg.durations[ph] || cfg.durations.focus) * 60000;
    const elapsed = Math.max(0, Math.min(1, parseFloat(e) || 0));
    const status = st === 'run' ? 'running' : elapsed > 0 ? 'paused' : 'idle';
    snap = {
      phase: ph,
      status,
      remainingMs: durationMs * (1 - elapsed),
      durationMs,
      endsAtWall: status === 'running' ? Date.now() + durationMs * (1 - elapsed) : null,
      rounds: +done || 0,
      settingsRevision: 0,
    };
    render();
    return true;
  }

  api.onSettings(applySettings);
  api.timer.onSnapshot(next => {
    if (!next) return;
    snap = next;
    pending = null;
    render();
  });
  api.timer.onPhaseComplete(event => {
    if (!event) return;
    if (cfg.sound) chime(event.completedPhase, cfg.volume);
    notify(event.completedPhase);
  });
  api.onCommand(c => { if (c === 'toggle') toggle(); });

  call(api.state.get).then(s => {
    if (s) cfg = { ...cfg, ...s };
    document.documentElement.style.setProperty('--a', cfg.opacity);
    if (cfg.settingsRecovered) { announcedRecovery = true; flash('settings reset', 4000); }
    if (!demo()) render();
  });

  if (!demo()) {
    call(api.timer.subscribe).then(result => {
      if (!result) return;
      if (result.snapshot) {
        snap = result.snapshot;
        pending = null;
      }
      if (result.notice) flash('a phase ended while away', 4000);
      render();
    });
  }
})();
</script>
</body>
</html>
