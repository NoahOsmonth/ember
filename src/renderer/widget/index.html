<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Ember</title>
<link rel="stylesheet" href="widget.css">
</head>
<body class="ready">
  <div id="app">
    <div class="time">
      <div class="digits" id="digits" role="timer" aria-label="Time remaining">25<span class="c">:</span>00</div>
      <div class="meta"><span class="state" id="state">ready</span><span class="pips" id="pips"></span></div>
    </div>
    <div class="strip">
      <div class="bars" id="bars"></div>
      <div class="foot">
        <span class="note" id="note"></span>
        <div class="ctl">
          <button class="play" id="bPlay" title="Start / pause (Space)" aria-label="Start or pause">
            <svg class="play-i" viewBox="0 0 12 12"><path d="M3 1.8v8.4L10 6z"/></svg>
            <svg class="pause-i" viewBox="0 0 12 12"><rect x="2.5" y="2" width="2.6" height="8" rx=".8"/><rect x="6.9" y="2" width="2.6" height="8" rx=".8"/></svg>
          </button>
          <button id="bSkip" class="skip" title="Skip to next (S)" aria-label="Skip"><svg viewBox="0 0 12 12"><path d="M2.5 2.5 7 6l-4.5 3.5z"/><path d="M9.5 2.5v7"/></svg></button>
          <button id="bReset" class="reset" title="Reset (R)" aria-label="Reset"><svg viewBox="0 0 12 12"><path d="M2.2 6a3.8 3.8 0 1 0 1.2-2.8"/><path d="M2.2 1.6v2.2h2.2"/></svg></button>
          <button id="bSettings" class="settings" title="Settings" aria-label="Settings"><svg viewBox="0 0 12 12"><path d="M1.5 3.5h9M1.5 8.5h9"/><circle cx="4" cy="3.5" r="1.3" fill="var(--bg, #0b0c10)"/><circle cx="8" cy="8.5" r="1.3" fill="var(--bg, #0b0c10)"/></svg></button>
        </div>
      </div>
    </div>
    <div class="fuse"><i id="fuse"></i></div>
  </div>

<script type="module" src="widget.js"></script>
</body>
</html>
